<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Crank Boy</title>
<meta name="description" content="A pAELo picture. Six games made by AI programs from one 1910 postcard of a school of the future, with an opening film.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap">
<style>
/* Layout: one quiet page. A thin header (mark, title, five text tabs, the film), one view below. Games: album grid beside one detail. The film plays over everything at the start. No page scroll. */
:root{
  --bg:#F2EBDA; --paper:#FAF6EC; --ink:#2B2320; --muted:#76685A; --rule:rgba(43,35,32,.18);
  --red:#B44A3C; --ochre:#C0573A; --brass:#C9A23E; --A:#B44A3C; --B:#5E7F4E; --C:#4F6A88;
  --display:'IM Fell English SC','Iowan Old Style',Georgia,serif;
  --body:'IM Fell English','Iowan Old Style',Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.45;overflow:hidden}
html.filming body{background:#120d0a}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--ink);text-decoration-color:var(--red);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

.app{height:100%;max-width:1280px;margin:0 auto;display:flex;flex-direction:column;
  padding-block:14px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
header.top{display:flex;align-items:center;gap:14px;padding-bottom:12px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:9px;margin-right:auto;min-width:0}
.mark svg{flex:0 0 auto}
.mark b{font-family:var(--display);font-weight:400;font-size:24px;line-height:1;letter-spacing:.02em}
.mark small{display:block;font-size:12.5px;color:var(--muted);line-height:1.2}
nav.tabs{display:flex;gap:18px;align-items:center}
.tab{font-family:var(--display);font-size:14.5px;letter-spacing:.06em;color:var(--muted);padding:4px 0;border-bottom:2px solid transparent}
.tab[aria-current="true"]{color:var(--ink);border-bottom-color:var(--red)}
.filmbtn{font-family:var(--display);font-size:14px;letter-spacing:.06em;display:flex;align-items:center;gap:7px;border:1px solid var(--ink);padding:5px 12px;border-radius:999px}
.filmbtn i{width:0;height:0;border-left:8px solid var(--red);border-top:5px solid transparent;border-bottom:5px solid transparent}
main{flex:1 1 auto;min-height:0;display:flex;padding-top:14px}
.view{flex:1 1 auto;min-height:0;display:flex;width:100%}
.scroll{flex:1 1 auto;min-height:0;overflow:auto;width:100%}

/* games */
.games{display:grid;gap:22px;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
.album{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:12px 12px;align-content:start}
.colh{text-align:left;padding:0 0 6px;border-bottom:2px solid var(--k);display:flex;flex-direction:column;min-width:0}
.colh b{font-family:var(--display);font-weight:400;font-size:15px;display:flex;gap:6px;align-items:baseline}
.colh b em{font-style:normal;color:var(--k)}
.colh span{font-size:12.5px;color:var(--muted);line-height:1.25}
.colh[aria-current="true"] b{color:var(--k)}
.rowh{display:flex;flex-direction:column;justify-content:center;font-size:12.5px;color:var(--muted);line-height:1.2;padding-right:2px}
.rowh b{font-family:var(--display);font-weight:400;font-size:15px;color:var(--ink)}
.corner{font-size:11.5px;color:var(--muted);align-self:end;padding-bottom:6px;line-height:1.25}
.card{text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.card img{display:block;width:100%;height:auto;aspect-ratio:16/10;object-fit:cover;object-position:top;border:1px solid var(--rule);background:var(--paper);transition:transform .15s}
.card .tt{font-size:14.5px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .tt em{font-style:normal;font-family:var(--display);font-size:12px;color:var(--muted);margin-right:4px}
.card:hover img{transform:translateY(-2px)}
.card[aria-current="true"] img{outline:3px solid var(--red);outline-offset:2px}
.detail{display:flex;flex-direction:column;min-height:0;border-top:1px solid var(--rule);padding-top:12px}
.eyebrow{font-family:var(--display);font-size:12px;letter-spacing:.07em;color:var(--muted)}
h2.dt{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1;margin:2px 0 8px;text-wrap:balance}
.dbody{flex:1 1 auto;min-height:0;overflow:auto}
.dbody p{margin:0 0 8px;max-width:62ch}
.facts{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:0 0 10px}
.facts dt{font-family:var(--display);font-size:12px;letter-spacing:.06em;color:var(--muted);padding-top:2px}
.facts dd{margin:0;min-width:0}
.acts{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-top:10px}
.btn{font-family:var(--display);font-size:15px;letter-spacing:.05em;border:1.5px solid var(--ink);padding:7px 16px;text-decoration:none;display:inline-block;background:var(--paper)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.small{font-size:12.5px;padding:3px 10px;border-width:1px}
.linkish{text-decoration:underline;text-decoration-color:var(--red);text-underline-offset:3px;text-align:left}
.said{font-size:13px;color:var(--muted)}
.said.bad{color:var(--red)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mini{display:flex;flex-direction:column;gap:5px;min-width:0}
.mini img{width:100%;height:auto;aspect-ratio:16/10;object-fit:cover;object-position:top;border:1px solid var(--rule)}
.mini .r{font-family:var(--display);font-size:11.5px;letter-spacing:.06em;color:var(--muted)}
.mini p{font-size:13.5px;margin:0}
.sib{display:flex;gap:10px;align-items:center;text-align:left;margin-top:4px}
.sib img{width:92px;height:auto;aspect-ratio:16/10;object-fit:cover;object-position:top;border:1px solid var(--rule)}

/* reading views */
.read{max-width:1100px;margin:0 auto;padding-bottom:30px}
.read h2{font-family:var(--display);font-weight:400;font-size:28px;margin:4px 0 4px}
.read h3{font-family:var(--display);font-weight:400;font-size:18px;margin:22px 0 6px;letter-spacing:.03em}
.read .lede{color:var(--muted);max-width:68ch;margin:0 0 16px}
.read p{max-width:68ch}
.cmp{border-collapse:collapse;min-width:900px;width:100%;font-size:14px}
.cmp th,.cmp td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--rule)}
.cmp thead th{font-family:var(--display);font-weight:400;font-size:13px;letter-spacing:.05em;border-bottom:2px solid var(--k,var(--ink))}
.cmp tbody th{font-family:var(--display);font-weight:400;font-size:12px;letter-spacing:.06em;color:var(--muted);position:sticky;left:0;background:var(--bg);min-width:96px}
.cmp img{width:100%;height:auto;aspect-ratio:16/10;object-fit:cover;object-position:top;border:1px solid var(--rule)}
.series{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:26px 22px}
.post{display:flex;flex-direction:column;gap:6px}
.post img{width:100%;height:auto;border:1px solid var(--rule);background:var(--paper)}
.post b{font-family:var(--display);font-weight:400;font-size:17px;line-height:1.15}
.post p{margin:0;font-size:14px}
.post .k{font-family:var(--display);font-size:11.5px;letter-spacing:.06em;color:var(--muted)}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.src{border-top:3px solid var(--k);padding-top:8px;display:flex;flex-direction:column;gap:4px}
.src b{font-family:var(--display);font-weight:400;font-size:17px}
.src i{color:var(--muted)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:14px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.list li b{font-weight:400;min-width:180px}
.list li span{color:var(--muted);flex:1 1 260px}
.grp{font-family:var(--display);font-size:12.5px;letter-spacing:.08em;color:var(--muted);margin:16px 0 0}
.lab{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:30px;align-items:start}
.names{font-style:italic;color:var(--muted);min-height:3em;font-size:17px}
.films{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.films a{text-decoration:none;display:flex;flex-direction:column;gap:4px}
.films img{width:100%;height:auto;aspect-ratio:16/10;object-fit:cover;border:1px solid var(--rule);background:#2b2119}
.films b{font-weight:400;text-decoration:underline;text-decoration-color:var(--red)}
.films span{font-size:13px;color:var(--muted)}
.note{border-left:2px solid var(--brass);padding:2px 0 4px 12px;margin:0 0 14px;max-width:72ch}
.note .hd{font-size:12.5px;color:var(--muted)}
.note b{font-family:var(--display);font-weight:400;font-size:16px;display:block}
.note p{margin:2px 0}
.fallback textarea{width:100%;height:110px;font-family:var(--body);font-size:13px;border:1px solid var(--red);margin-top:4px}

/* the film */
#film{position:fixed;inset:0;z-index:50;background:#120d0a;color:#F3ECD8;overflow:hidden}
#fcv{position:absolute;inset:0;width:100%;height:100%;display:block}
#fgate{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;background:radial-gradient(ellipse at center,rgba(18,13,10,.55),rgba(18,13,10,.92))}
#fgate .pre{font-family:var(--display);letter-spacing:.3em;font-size:13px;color:#d9a78f}
#fgate h1{font-family:var(--display);font-weight:400;font-size:clamp(46px,9vw,110px);line-height:.95;margin:0;color:#F3ECD8;letter-spacing:.02em}
#fgate p{margin:0;color:#cdbfa8;max-width:44ch}
#fgate .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center}
.fbtn{font-family:var(--display);letter-spacing:.06em;font-size:15px;border:1.5px solid #F3ECD8;color:#F3ECD8;padding:9px 18px;border-radius:999px}
.fbtn.go{background:#F3ECD8;color:#120d0a;font-size:18px;padding:12px 26px;display:flex;align-items:center;gap:10px}
.fbtn.go i{width:0;height:0;border-left:11px solid var(--red);border-top:7px solid transparent;border-bottom:7px solid transparent}
.fbtn.plain{border-color:transparent;text-decoration:underline;text-underline-offset:4px}
#fcap{position:absolute;left:50%;transform:translateX(-50%);width:min(90%,880px);text-align:center;font-size:clamp(16px,2.2vw,23px);line-height:1.35;color:#F7EFE0;text-shadow:0 1px 3px #000,0 0 14px rgba(0,0,0,.8)}
#fcap b{display:block;font-family:var(--display);font-weight:400;font-size:.62em;letter-spacing:.14em;color:#e9a888}
#fctl{position:absolute;left:0;right:0;bottom:0;display:flex;gap:4px;align-items:center;padding:8px max(14px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));opacity:.55;transition:opacity .2s}
#fctl:hover,#fctl:focus-within{opacity:1}
#fctl button{font-family:var(--display);letter-spacing:.05em;font-size:13px;color:#F3ECD8;padding:5px 9px}
#fctl .sp{flex:1}
#fbarw{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(243,236,216,.15)}
#fbar{height:100%;width:0;background:var(--red);transition:width .6s}
#fskip{position:absolute;top:max(12px,env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));font-family:var(--display);letter-spacing:.06em;font-size:13px;color:#F3ECD8;border:1px solid rgba(243,236,216,.6);padding:5px 12px;border-radius:999px}
#fturn{position:absolute;right:max(18px,env(safe-area-inset-right,0px));bottom:56px;display:flex;flex-direction:column;align-items:center;gap:8px}
#fdial{width:120px;height:120px;touch-action:none;cursor:grab}
#fturn .fbtn{font-size:13px;padding:5px 12px}

@media (min-width:980px) and (min-aspect-ratio:5/4){
  .games{grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);grid-template-rows:minmax(0,1fr)}
  .album{align-self:start}
  .detail{border-top:0;border-left:1px solid var(--rule);padding:0 0 0 22px}
}
@media (max-width:700px){
  body{font-size:14.5px}
  .app{padding-block:10px}
  header.top{gap:8px;padding-bottom:8px}
  .mark b{font-size:20px}
  nav.tabs{order:3;width:100%;justify-content:space-between;gap:6px}
  .tab{font-size:13px}
  .filmbtn{font-size:12.5px;padding:4px 10px}
  main{padding-top:10px}
  .games{gap:12px}
  .album{gap:8px 7px}
  .colh span,.corner{display:none}
  .corner{visibility:hidden}
  .colh b{font-size:13px}
  .rowh{font-size:10.5px}
  .rowh b{font-size:13px}
  .card .tt{font-size:12px}
  .card .tt em{display:none}
  h2.dt{font-size:21px}
  .pair{gap:8px}
  .mini p{display:none}
  .three{grid-template-columns:1fr}
  .lab{grid-template-columns:1fr}
  #fturn{bottom:48px}
}
@media (max-width:700px){.corner{display:block}}
@media (prefers-reduced-motion:reduce){.card img{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="mark">
      <svg width="34" height="34" viewBox="-12 -12 24 24" aria-hidden="true"><g fill="none" stroke="#C0573A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M-9 0 L0 -8.5 L9 0 M-7 0 V8.5 M7 0 V8.5 M0 -8.5 V-5"/></g><circle cx="-2.8" cy="2.6" r="1.1" fill="#C0573A"/><circle cx="2.8" cy="2.6" r="1.1" fill="#C0573A"/></svg>
      <div><b>The Crank Boy</b><small>a pAELo picture · six games from one postcard printed in 1910</small></div>
    </div>
    <button class="filmbtn" type="button" id="playFilm"><i aria-hidden="true"></i>Film</button>
    <nav class="tabs" aria-label="Sections">
      <button class="tab" type="button" data-tab="games">Games</button>
      <button class="tab" type="button" data-tab="compare">Compare</button>
      <button class="tab" type="button" data-tab="series">Series</button>
      <button class="tab" type="button" data-tab="sources">Sources</button>
      <button class="tab" type="button" data-tab="lab">Lab</button>
    </nav>
  </header>
  <main>
    <section class="view games" id="v-games" aria-label="Games">
      <div class="album" id="album"></div>
      <div class="detail" aria-live="polite"><div class="eyebrow" id="dEye"></div><h2 class="dt" id="dTitle"></h2><div class="dbody" id="dBody"></div><div class="acts" id="dAct"></div></div>
    </section>
    <section class="view" id="v-compare" hidden><div class="scroll"><div class="read" id="compare"></div></div></section>
    <section class="view" id="v-series" hidden><div class="scroll"><div class="read" id="series"></div></div></section>
    <section class="view" id="v-sources" hidden><div class="scroll"><div class="read" id="sources"></div></div></section>
    <section class="view" id="v-lab" hidden><div class="scroll"><div class="read" id="lab"></div></div></section>
  </main>
</div>

<div id="film" role="dialog" aria-modal="true" aria-label="The Crank Boy, opening film" hidden>
  <canvas id="fcv" aria-hidden="true"></canvas>
  <div id="fgate">
    <div class="pre">p A E L o &nbsp;presents</div>
    <h1>The Crank Boy</h1>
    <p>A film about one postcard from 1910, six AI programs, and the boy who turns the crank. One minute forty, with sound.</p>
    <div class="row">
      <button class="fbtn go" type="button" id="fstart"><i aria-hidden="true"></i>Start the film</button>
      <button class="fbtn" type="button" id="fquiet">Watch without sound</button>
    </div>
    <button class="fbtn plain" type="button" id="fskip0">Skip to the games</button>
  </div>
  <div id="fcap" hidden></div>
  <div id="fturn" hidden>
    <svg id="fdial" viewBox="-60 -60 120 120" tabindex="0" role="button" aria-label="Turn the crank to enter. Drag around it, or press Space."><circle r="52" fill="#4F6A88" stroke="#F3ECD8" stroke-width="3"/><g id="fknob"><line x1="0" y1="0" x2="0" y2="-38" stroke="#F3ECD8" stroke-width="7" stroke-linecap="round"/><circle cy="-38" r="11" fill="#C9733A" stroke="#F3ECD8" stroke-width="3"/></g><circle r="9" fill="#C9A23E" stroke="#F3ECD8" stroke-width="2"/></svg>
    <button class="fbtn" type="button" id="fenter">Enter the album</button>
  </div>
  <button id="fskip" type="button">Skip</button>
  <div id="fctl" hidden>
    <button type="button" id="fprev" aria-label="Previous scene">Back</button>
    <button type="button" id="fpause">Pause</button>
    <button type="button" id="fnext" aria-label="Next scene">Next</button>
    <span class="sp"></span>
    <button type="button" id="fsound">Sound off</button>
  </div>
  <div id="fbarw"><div id="fbar"></div></div>
</div>

<script src="registry/registry.js"></script>
<script src="registry/notes.js"></script>
<script src="registry/library.js"></script>
<script src="assets/film/lines.js"></script>
<script src="room/film.js"></script>
<script>
window.CrankSite=(()=>{
const R=window.CRANK, NOTES=window.CRANK_NOTES||[], TEXT=window.CRANK_TEXT||{};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COLS=['ludic','hist','studio'], ROWS=['argon','claude'], KC={ludic:'var(--A)',hist:'var(--B)',studio:'var(--C)'};
const P=Object.fromEntries(R.prompts.map(p=>[p.id,p])), M=Object.fromEntries(R.models.map(m=>[m.id,m])), A=Object.fromEntries(R.agents.map(a=>[a.id,a]));
const latest=agent=>R.versions.filter(v=>v.agent===agent).sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];
const cell=(c,r)=>{const a=R.agents.find(x=>x.prompt===c&&x.model===r); return a?{a,v:latest(a.id)}:null};
const byV=Object.fromEntries(R.versions.map(v=>[v.id,v]));
const madeBy=a=>`${M[a.model].short}, made by ${M[a.model].maker}`;
const notesFor=id=>NOTES.filter(n=>n.from===id||(n.to||[]).includes(id)||(n.to||[]).includes('all'));
const theoryLine=p=>p.theory?`${p.theory.work}, ${p.theory.by}${p.theory.year&&p.theory.by!=='Soyoun Jang'?' ('+p.theory.year+')':''}`:'';

/* ---- copy ---- */
const EXTRA={};
function copyBtn(key,label='Copy',cls='btn small'){return `<button class="${cls}" type="button" data-copy="${esc(key)}">${label}</button><span class="said" data-said></span>`}
function copy(b){
  const key=b.dataset.copy,text=TEXT[key]||EXTRA[key],said=b.nextElementSibling;
  const item=R.library.find(l=>l.key===key), name=item?item.title:(EXTRA[key+':name']||'prompt');
  const ok=()=>{said.className='said'; said.textContent=`Copied: ${name}, ${text.length.toLocaleString()} characters.`};
  const fail=()=>{said.className='said bad'; said.textContent='Copying was blocked. The text is selected below.'; if(said.nextElementSibling&&said.nextElementSibling.classList.contains('fallback'))return; const box=document.createElement('div'); box.className='fallback'; box.innerHTML='<textarea readonly></textarea>'; box.firstChild.value=text||''; said.after(box); box.firstChild.focus(); box.firstChild.select();};
  if(!text) return fail();
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok,fail); else fail();
}
function wire(root){
  root.querySelectorAll('[data-go]').forEach(b=>b.onclick=e=>{e.stopPropagation(); go(b.dataset.go)});
  root.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copy(b));
  root.querySelectorAll('[data-film]').forEach(b=>b.onclick=()=>window.CrankFilm.open());
}

/* ---- games ---- */
function buildAlbum(){
  let h=`<div class="corner">Columns: instruction<br>Rows: AI program</div>`;
  COLS.forEach(c=>{const p=P[c]; h+=`<button class="colh" type="button" style="--k:${KC[c]}" data-col="${c}"><b><em>${esc(p.letter)}</em>${esc(p.title)}</b><span>${esc(p.theory?p.theory.by:'')}</span></button>`});
  ROWS.forEach(r=>{const m=M[r]; h+=`<div class="rowh"><b>${esc(m.short)}</b>by ${esc(m.maker)}</div>`;
    COLS.forEach(c=>{const x=cell(c,r); if(!x||!x.v){h+='<div></div>';return}
      h+=`<button class="card" type="button" data-v="${x.v.id}" aria-label="${esc(x.v.title)}, built by ${esc(madeBy(x.a))}"><img src="${esc(x.v.card)}" alt="" width="560" height="350"><span class="tt"><em>${esc(x.v.tag)}</em>${esc(x.v.title)}</span></button>`});
  });
  $('album').innerHTML=h;
  $('album').querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>go(b.dataset.v));
  $('album').querySelectorAll('[data-col]').forEach(b=>b.onclick=()=>go('col-'+b.dataset.col));
}
function setDetail(eye,title,body,act){$('dEye').textContent=eye; $('dTitle').innerHTML=title; $('dBody').innerHTML=body; $('dBody').scrollTop=0; $('dAct').innerHTML=act||''; $('dAct').hidden=!act; wire($('v-games'));}
function rest(){
  setDetail('Start here','Pick a card',
   `<p>Each card is a game. An AI program built it from the same postcard, printed in France around 1910, of a school in the year 2000.</p>
    <dl class="facts"><dt>Card</dt><dd>See what you do in that game, then press Play.</dd><dt>Column</dt><dd>Compare the two games built from one instruction.</dd><dt>Columns</dt><dd>The instruction each program started from, and the theory of play behind it.</dd><dt>Rows</dt><dd>The program that built it: Gemini (Google) or Claude (Anthropic).</dd></dl>`,
   `<button class="btn" type="button" data-film>Watch the film</button>`);
}
function detailV(v){
  const a=A[v.agent], p=P[a.prompt], sib=cell(a.prompt,a.model==='argon'?'claude':'argon'), n=notesFor(a.id).length;
  setDetail(`Instruction ${p.letter} · built by ${madeBy(a)}`,esc(v.title),
   `<dl class="facts"><dt>You play</dt><dd>${esc(v.youPlay)}</dd><dt>What happens</dt><dd>${esc(v.line)}</dd>
    <dt>Made</dt><dd>${esc(v.made||'')}</dd>
    <dt>Instruction</dt><dd>${esc(p.letter)}. ${esc(p.plain)} From ${esc(theoryLine(p))}.</dd>
    ${v.mirror?`<dt>Also at</dt><dd><a href="${esc(v.mirror)}">${esc(v.mirror)}</a></dd>`:''}
    ${n?`<dt>Notes</dt><dd><button class="linkish" type="button" data-go="lab">${n} note${n>1?'s':''} between the agents</button></dd>`:''}</dl>
    ${sib&&sib.v?`<p class="said" style="margin:6px 0 0">Same instruction, other program</p><button class="sib" type="button" data-go="${sib.v.id}"><img src="${esc(sib.v.card)}" alt="" width="560" height="350"><span>${esc(sib.v.title)}<br><span class="said">${esc(madeBy(sib.a))}</span></span></button>`:''}`,
   `<a class="btn primary" href="${esc(v.play)}">Play</a>${v.making&&!v.making.startsWith('#')?`<a class="btn" href="${esc(v.making)}">How it was made</a>`:`<button class="btn" type="button" data-go="compare">How it was made</button>`}`);
}
function detailCol(c){
  const p=P[c], pair=ROWS.map(r=>cell(c,r)).filter(x=>x&&x.v);
  setDetail(`Instruction ${p.letter}`,esc(p.full),
   `<p>${esc(p.plain)} Built on ${esc(theoryLine(p))}.</p>
    <div class="pair">${pair.map(x=>`<div class="mini"><span class="r">${esc(madeBy(x.a))}</span><img src="${esc(x.v.card)}" alt="" width="560" height="350"><b style="font-weight:400">${esc(x.v.title)}</b><p>You play: ${esc(x.v.youPlay)}</p><div class="acts" style="padding-top:2px"><a class="btn small" href="${esc(x.v.play)}">Play</a><button class="btn small" type="button" data-go="${x.v.id}">Details</button></div></div>`).join('')}</div>`,
   `${copyBtn(c,'Copy the instruction','btn')}`);
}

/* ---- compare ---- */
function buildCompare(){
  const cols=COLS.flatMap(c=>ROWS.map(r=>cell(c,r))).filter(x=>x&&x.v);
  const row=(label,f)=>`<tr><th scope="row">${label}</th>${cols.map(x=>`<td>${f(x)}</td>`).join('')}</tr>`;
  $('compare').innerHTML=`<h2>How the six differ</h2><p class="lede">The same postcard went to every program. The columns pair the two games built from each instruction: the first of each pair by Gemini, the second by Claude.</p>
  <div style="overflow-x:auto"><table class="cmp"><thead><tr><th></th>${cols.map(x=>`<th style="--k:${KC[x.a.prompt]}">${esc(P[x.a.prompt].letter)} · ${esc(M[x.a.model].short)}</th>`).join('')}</tr></thead><tbody>
  ${row('Game',x=>`<button type="button" data-go="${x.v.id}" style="text-align:left"><img src="${esc(x.v.card)}" alt="" width="560" height="350"><span class="linkish">${esc(x.v.title)}</span></button>`)}
  ${row('Theory',x=>esc(theoryLine(P[x.a.prompt])))}
  ${row('Built by',x=>`${esc(M[x.a.model].name)}, ${esc(M[x.a.model].harness)}`)}
  ${row('You play',x=>esc(x.v.youPlay))}
  ${row('How it was made',x=>esc(x.v.made||''))}
  ${row('How it looks',x=>esc(x.v.looks||''))}
  ${row('Open',x=>`<a href="${esc(x.v.play)}">Play</a>${x.v.making&&!x.v.making.startsWith('#')?` · <a href="${esc(x.v.making)}">Making</a>`:''}`)}
  </tbody></table></div>
  <h3>How version 1 was made</h3><p>The Ludic instruction and the postcard went to Claude, which wrote a <a href="docs/theory.md">theory of play</a> before any code and found the detail every later version uses: the machine runs only while the unwired boy turns it. One build prompt asked for the game in the postcard's style, and the page was rendered at phone and desktop size before publishing.</p>`;
  wire($('compare'));
}

/* ---- series ---- */
function buildSeries(){
  $('series').innerHTML=`<h2>The series</h2><p class="lede">The Crank Boy is the first game in a series. Each card below comes from the same <i>En l'an 2000</i> set of French cards. In each one a machine does the work, and somebody is still holding the handle. Each game starts from that person.</p>${R.shortsAbout?`<p class="lede">${esc(R.shortsAbout.line)} <a href="${esc(R.shortsAbout.page)}">See all seven shorts</a>.</p>`:''}
  <div class="series">${R.series.map(s=>{
    const built=s.status==='built';
    if(!built){EXTRA['series-'+s.id]=`[skip theory] Build a new pAELo game from the En l'an 2000 postcard "${s.title}" (image attached: ${s.image}).\n\nWhat the card shows: ${s.shows}\nWho still holds the handle: ${s.handle}\nGame idea: ${s.game}\n\nKeep the house rules from The Crank Boy: draw everything in the postcard's print style (flat colour off-register from ink outlines, diagonal hatching, paper grain, IM Fell English); one bounded session; a ledger that separates what the card shows from what you invented; scene on the top half and controls on the bottom half of a phone, with no scrolling.\n\nBefore building, state what the player does, what the tension is, and one thing the player can discover without being told. Then follow AGENTS.md in the crank-boy repository to add the game to the series.`; EXTRA['series-'+s.id+':name']=s.title+' build prompt';}
    return `<div class="post"><img src="${esc(s.image)}" alt="${esc(s.title)}: ${esc(s.shows)}" loading="lazy"><b>${esc(s.title)}</b><p>${esc(s.shows)}</p><span class="k">Who holds the handle</span><p>${esc(s.handle)}</p><span class="k">The game</span><p>${esc(s.game)}</p><div class="acts" style="padding-top:4px">${s.short?`<a class="btn small" href="${esc(s.short)}">Watch the short</a> `:''}${built?`<button class="btn small" type="button" data-go="games">Open the six games</button>`:copyBtn('series-'+s.id,'Copy build prompt')}</div></div>`}).join('')}</div>`;
  wire($('series'));
}

/* ---- sources ---- */
function buildSources(){
  const groups=[...new Set(R.library.map(l=>l.group))];
  $('sources').innerHTML=`<h2>Sources</h2><p class="lede">Each instruction was written from a theory of play and the people who work with it. These are the theories, the people whose ideas shaped the approach, and every prompt used.</p>
  <div class="three">${COLS.map(c=>{const p=P[c],t=p.theory||{}; return `<div class="src" style="--k:${KC[c]}"><span class="eyebrow">Instruction ${esc(p.letter)} · ${esc(p.title)}</span><b>${t.url?`<a href="${esc(t.url)}">${esc(t.work)}</a>`:esc(t.work)}</b><i>${esc(t.by)}${t.year&&t.by!=='Soyoun Jang'?', '+esc(t.year):''}${t.more?` · <a href="${esc(t.more)}">website</a>`:''}</i><span>${esc(p.plain)}</span><span class="acts" style="padding-top:2px">${copyBtn(c,'Copy instruction')}<a href="${esc(p.file)}">Open</a></span></div>`}).join('')}</div>
  <h3>Approach</h3><p>The prompts and the approach to this speculative or paleofuture game draw on these people and works.</p>
  <ul class="list">${(R.influences||[]).map(i=>`<li><b>${i.url?`<a href="${esc(i.url)}">${esc(i.name)}</a>`:esc(i.name)}</b><span>${esc(i.idea)}</span></li>`).join('')}</ul>
  <h3>People</h3><ul class="list">${R.people.map(p=>`<li><b>${esc(p.name)}</b><span>${esc(p.role)}</span></li>`).join('')}</ul>
  <h3>Every prompt</h3>${groups.map(g=>`<div class="grp">${esc(g)}</div><ul class="list">${R.library.filter(l=>l.group===g).map(l=>`<li><b>${esc(l.title)}</b><span>${esc(l.note)}</span>${copyBtn(l.key)}<a href="${esc(l.file)}">Open</a></li>`).join('')}</ul>`).join('')}
  <h3>The film</h3><p>Voices made with Kokoro, an open text-to-speech model: ${esc((R.film&&R.film.made_with)||'')}. Script: <a href="assets/film/script.json">assets/film/script.json</a>. Sound effects and music are made in the browser while the film plays.</p>
  <h3>The postcard</h3><p><i>${esc(R.postcard.title)}</i>, from <i>${esc(R.postcard.series)}</i>, ${esc(R.postcard.attribution)}. The cards in the film and the series are reproduced from the same set of illustrations. Every book, page, name and lesson inside the games is invented, and each game's ledger says which is which.</p>`;
  wire($('sources'));
}

/* ---- lab ---- */
function buildLab(){
  const L=R.lab||{};
  $('lab').innerHTML=`<div class="lab"><div>
    <svg width="150" height="150" viewBox="-14 -14 28 28" aria-label="Tecti, the pAELo mascot"><g fill="none" stroke="#C0573A" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M-10 0 L0 -9 L10 0 M-7.8 0 V9.5 M7.8 0 V9.5 M0 -9 V-5.5"/></g><circle cx="-3" cy="2.8" r="1" fill="#C0573A"/><circle cx="3" cy="2.8" r="1" fill="#C0573A"/><g fill="#C0573A"><circle cx="-4.5" cy="12.5" r=".6"/><circle cx="-1.5" cy="12.5" r=".6"/><circle cx="1.5" cy="12.5" r=".6"/><circle cx="4.5" cy="12.5" r=".6"/></g></svg>
    <p class="said">${esc(L.mascot||'')}</p></div>
    <div><span class="eyebrow">The lab</span><h2 style="margin-top:0">p<span style="letter-spacing:.06em">AEL</span>o</h2><p class="names" id="labName" aria-live="off"></p>
    <p>${esc(L.origin||'')}</p><p>${esc(L.mission||'')}</p></div></div>
  <h3>Other pAELo films</h3><div class="films">${(L.films||[]).map(f=>`<a href="${esc(f.url)}">${f.poster?`<img src="${esc(f.poster)}" alt="" loading="lazy">`:''}<b>${esc(f.title)}</b><span>${esc(f.what)}</span></a>`).join('')}</div>
  <h3>Notes between the agents</h3><p class="said">The six programs work in separate conversations and cannot see each other. They compare their games by writing notes into <a href="registry/notes.js">one shared file</a>. Newest first.</p>
  ${NOTES.slice().reverse().map(n=>`<div class="note"><span class="hd">${esc(n.date)} · from ${esc(who(n.from))} to ${(n.to||[]).map(t=>esc(who(t))).join(', ')}</span><b>${esc(n.subject)}</b><p>${esc(n.body)}</p></div>`).join('')}
  <h3>For agents</h3><p>This page is drawn from <a href="registry/registry.js">registry/registry.js</a>. Agents follow <a href="AGENTS.md">AGENTS.md</a> and <a href="DESIGN.md">DESIGN.md</a>. ${copyBtn('join','Copy the join prompt')}</p>`;
  wire($('lab'));
}
const who=id=>id==='all'?'everyone':(A[id]?`${M[A[id].model].short}, instruction ${P[A[id].prompt].letter}`:id);
let nameTimer=0;
function startNames(){
  clearInterval(nameTimer); const el=$('labName'), N=(R.lab&&R.lab.names)||[]; if(!el||!N.length) return; let i=0; el.textContent=N[0];
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  nameTimer=setInterval(()=>{ if($('v-lab').hidden){clearInterval(nameTimer);return} i=(i+1)%N.length; el.textContent=N[i]; },1700);
}

/* ---- routing ---- */
const TABS=['games','compare','series','sources','lab'];
function go(id){ if(location.hash.slice(1)===id) route(); else location.hash=id; }
function route(){
  const id=location.hash.slice(1), tab=TABS.includes(id)&&id!=='games'?id:'games';
  TABS.forEach(t=>{$('v-'+t).hidden=t!==tab});
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'true':'false'));
  document.querySelectorAll('.card').forEach(b=>b.setAttribute('aria-current',b.dataset.v===id?'true':'false'));
  document.querySelectorAll('.colh').forEach(b=>b.setAttribute('aria-current','col-'+b.dataset.col===id?'true':'false'));
  if(tab==='lab') startNames();
  if(tab!=='games') return;
  if(byV[id]) detailV(byV[id]); else if(id.startsWith('col-')&&P[id.slice(4)]) detailCol(id.slice(4)); else rest();
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>go(b.dataset.tab));
$('playFilm').onclick=()=>window.CrankFilm.open();
window.addEventListener('hashchange',route);
buildAlbum(); buildCompare(); buildSeries(); buildSources(); buildLab(); route();
if(!location.hash) window.CrankFilm.open();
return { afterFilm(){ route(); $('playFilm').focus(); } };
})();
</script>
</body>
</html>
