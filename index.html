<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Crank Boy</title>
<meta name="description" content="Six agents read Villemard's 1910 postcard 'At School' from three starting prompts. Each student in this classroom is one agent and the game it built.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap">
<link rel="stylesheet" href="room/room.css">
<style>
/* Layout: the room (postcard) is the map; the seating plan beneath it is the table of contents; one card shows the selected object. No page scroll. */
:root{
  --table:#D6C69E; --paper:#F3ECD8; --ink:#2B2320; --muted:#6E5F4F; --wall:#E8D59A;
  --slate:#4F6A88; --brass:#C9A23E; --red:#B44A3C; --orange:#C9733A;
  --display:'IM Fell English SC','Iowan Old Style',Georgia,serif;
  --body:'IM Fell English','Iowan Old Style',Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--table);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;overflow:hidden}
.app{height:100%;max-width:1320px;margin:0 auto;display:grid;gap:10px;
  grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"room" "plan" "card";
  padding-block:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.post{grid-area:room;background:var(--paper);padding:8px 8px 4px;box-shadow:0 1px 0 rgba(43,35,32,.18),0 8px 20px rgba(70,50,20,.18);min-height:0;display:flex;flex-direction:column}
.stage{position:relative;width:100%;aspect-ratio:8/5;max-height:40vh;max-height:40dvh}
.stage canvas{position:absolute;inset:0;display:block}
.cap{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:3px 2px 0}
.cap button{all:unset;cursor:pointer;font-family:var(--body);font-size:13px;text-decoration:underline;text-decoration-color:var(--red);text-underline-offset:3px}
.cap button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.cap i{color:var(--muted)}

/* seating plan */
.plan{grid-area:plan;background:var(--paper);border:1px solid var(--ink);padding:8px;display:flex;flex-direction:column;gap:8px}
.chart{display:grid;grid-template-columns:52px repeat(3,minmax(0,1fr));gap:4px}
.chart .rl{font-family:var(--display);font-size:10.5px;letter-spacing:.05em;color:var(--muted);line-height:1.1;display:flex;flex-direction:column;justify-content:center}
.chart .rl b{font-weight:400;color:var(--ink);font-size:11.5px}
.colh,.seat,.obj{font-family:var(--display);color:var(--ink);background:var(--paper);border:1.5px solid var(--ink);cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.colh{font-size:12px;letter-spacing:.05em;padding:4px 2px;background:var(--wall);display:flex;align-items:center;justify-content:center;gap:5px;min-width:0}
.colh svg{flex:0 0 auto}
.seat{display:flex;align-items:center;gap:6px;padding:4px 6px;min-width:0;text-align:left;font-family:var(--body);font-size:13px}
.seat .tg{flex:0 0 auto;font-family:var(--display);font-size:12px;min-width:24px;height:22px;border:1.5px solid var(--ink);border-radius:11px;background:var(--brass);display:flex;align-items:center;justify-content:center;padding:0 4px}
.seat .tt{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.objs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.obj{font-size:12.5px;letter-spacing:.04em;padding:6px 2px}
.obj small{display:block;font-family:var(--body);font-size:10.5px;letter-spacing:0;color:var(--muted);line-height:1}
[aria-current="true"]{background:var(--red)!important;color:var(--paper)!important;border-color:var(--ink)}
[aria-current="true"] .tg{background:var(--paper);color:var(--ink)}
[aria-current="true"] small{color:var(--paper)!important}
.colh:focus-visible,.seat:focus-visible,.obj:focus-visible,.btn:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* the card */
.card{grid-area:card;min-height:0;background:var(--paper);border:1px solid var(--ink);display:flex;flex-direction:column;box-shadow:0 6px 16px rgba(70,50,20,.15)}
.card header{padding:10px 14px 6px;border-bottom:1.5px solid var(--ink);display:flex;flex-direction:column;gap:2px}
.eyebrow{font-family:var(--display);font-size:11.5px;letter-spacing:.08em;color:var(--muted)}
.card h2{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.02em;margin:0;line-height:1.1;text-wrap:balance;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.stamp{font-family:var(--display);font-size:11px;letter-spacing:.08em;border:1px solid currentColor;padding:0 6px;color:var(--slate)}
.stamp.plan{color:var(--muted);border-style:dashed}
.body{flex:1 1 auto;min-height:0;overflow:auto;padding:10px 14px}
.body p{margin:0 0 8px;max-width:66ch}
.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0 0 10px;font-size:14px}
.facts dt{font-family:var(--display);font-size:11.5px;letter-spacing:.06em;color:var(--muted);padding-top:2px}
.facts dd{margin:0;min-width:0}
.linkish{all:unset;cursor:pointer;text-decoration:underline;text-decoration-color:var(--red);text-underline-offset:3px}
.linkish:focus-visible{outline:2px solid var(--red)}
a{color:var(--ink);text-decoration-color:var(--red);text-underline-offset:3px}
.actions{border-top:1.5px solid var(--ink);padding:8px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{font-family:var(--display);font-size:14px;letter-spacing:.05em;color:var(--ink);background:var(--paper);border:1.5px solid var(--ink);
  padding:7px 14px;box-shadow:2px 2px 0 var(--ink);text-decoration:none;cursor:pointer;display:inline-block}
.btn.primary{background:var(--wall);box-shadow:3px 3px 0 var(--ink)}
.btn.small{font-size:12px;padding:3px 9px;box-shadow:1px 1px 0 var(--ink)}
.btn:active{transform:translate(1px,1px)}
.said{font-size:13px;color:var(--muted)}
.said.bad{color:var(--red)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{border:1.5px solid var(--ink);padding:8px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.mini .r{font-family:var(--display);font-size:11px;letter-spacing:.06em;color:var(--muted)}
.mini b{font-family:var(--display);font-weight:400;font-size:16px;line-height:1.15}
.mini p{font-size:13.5px;margin:0}
.mini .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
td,th{text-align:left;padding:5px 6px;border-bottom:1px solid rgba(43,35,32,.25);vertical-align:top}
th{font-family:var(--display);font-weight:400;font-size:11px;letter-spacing:.07em;color:var(--muted)}
tr.go{cursor:pointer}
tr.go:hover td{background:rgba(232,213,154,.5)}
.tw{overflow-x:auto}
.ptag{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:20px;border:1.5px solid var(--ink);border-radius:10px;background:var(--brass);font-family:var(--display);font-size:11px;padding:0 4px}
.grp{font-family:var(--display);font-size:12px;letter-spacing:.08em;color:var(--muted);margin:10px 0 4px;border-bottom:1px solid rgba(43,35,32,.3)}
.grp:first-child{margin-top:0}
.book{display:flex;gap:10px;align-items:center;padding:5px 0;border-bottom:1px dotted rgba(43,35,32,.3)}
.book .sp{flex:0 0 auto;width:9px;height:26px;border:1.5px solid var(--ink)}
.book .bt{flex:1 1 auto;min-width:0}
.book .bt b{font-weight:400;display:block}
.book .bt span{font-size:12.5px;color:var(--muted)}
.book .ba{flex:0 0 auto;display:flex;gap:6px;align-items:center}
.note{border-left:3px solid var(--brass);padding:4px 0 6px 10px;margin:0 0 10px}
.note .hd{font-size:12.5px;color:var(--muted)}
.note b{font-family:var(--display);font-weight:400;font-size:15px;display:block}
.note p{font-size:14px;margin:2px 0}
.note .ln{font-size:12.5px}
details{margin:8px 0}
summary{cursor:pointer;font-family:var(--display);letter-spacing:.05em}
ol.st{margin:6px 0;padding-left:20px}
ol.st li{margin-bottom:4px}
.fallback textarea{width:100%;height:120px;font-family:var(--body);font-size:13px;border:1px solid var(--red)}
.thumb{float:right;width:42%;max-width:220px;margin:0 0 8px 12px;border:1px solid var(--ink)}
@media (min-width:980px) and (min-aspect-ratio:5/4){
  .app{grid-template-columns:minmax(0,1.5fr) minmax(360px,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"room plan" "room card"}
  .post{align-self:start}
  .stage{max-height:calc(100dvh - 60px)}
  .card h2{font-size:26px}
}
@media (max-width:560px){
  body{font-size:14px}
  .two{grid-template-columns:1fr}
  .objs{grid-template-columns:repeat(3,minmax(0,1fr))}
  .chart{grid-template-columns:44px repeat(3,minmax(0,1fr))}
  .seat{font-size:12px;gap:4px;padding:3px 4px}
  .card h2{font-size:19px}
  .thumb{width:38%}
  .reg th:nth-child(4),.reg td:nth-child(4),.reg th:nth-child(5),.reg td:nth-child(5){display:none}
  .reg td.pl{display:table-cell}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="app">
  <div class="post">
    <div class="stage" id="stage"><canvas id="room" role="img" aria-label="The classroom. Six students in two rows: the back row are the Gemini Argon agents, the front row the Claude Opus agents. Each column began from one prompt, framed on the wall above it. The teacher, the bookshelf, the machine, the crank boy and the window open the rest of the index."></canvas></div>
    <div class="cap"><button type="button" id="home">The Crank Boy</button><i>At School, Villemard, about 1910</i></div>
  </div>

  <nav class="plan" aria-label="Seating plan">
    <div class="chart" id="chart"></div>
    <div class="objs" id="objs"></div>
  </nav>

  <section class="card" id="card" aria-live="polite">
    <header><div class="eyebrow" id="eyebrow"></div><h2 id="title"></h2></header>
    <div class="body" id="body"></div>
    <div class="actions" id="actions"></div>
  </section>
</div>

<script src="registry/registry.js"></script>
<script src="registry/notes.js"></script>
<script src="registry/library.js"></script>
<script>
(()=>{
const R=window.CRANK, NOTES=window.CRANK_NOTES||[], TEXT=window.CRANK_TEXT||{};
const W=800,H=500,TAU=Math.PI*2,INK='#2B2320';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const agentById=Object.fromEntries(R.agents.map(a=>[a.id,a]));
const promptById=Object.fromEntries(R.prompts.map(p=>[p.id,p]));
const modelById=Object.fromEntries(R.models.map(m=>[m.id,m]));
const versionsOf=id=>R.versions.filter(v=>v.agent===id).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
const COLS=['ludic','hist','studio'];
const COLOR={ludic:'#B44A3C',hist:'#5E7F4E',studio:'#4F6A88'};
const OBJECTS=[
  {id:'register',label:'Register',where:'The teacher'},
  {id:'shelf',label:'Prompts',where:'The shelf'},
  {id:'notes',label:'Notes',where:'On the desk'},
  {id:'line',label:'Shared line',where:'The machine'},
  {id:'about',label:'About',where:'The crank boy'},
  {id:'repo',label:'Repository',where:'The window'}
];

/* ---------- seats in the room ---------- */
const POS={ // column -> front (claude) and back (argon) student positions
  ludic:{front:{x:165,y:214},back:{x:205,y:168}},
  hist:{front:{x:285,y:212},back:{x:300,y:166}},
  studio:{front:{x:405,y:214},back:{x:395,y:168}}
};
const JACKET={'ludic-claude':'#6F90BA','hist-claude':'#B44A3C','studio-claude':'#89A7CF','ludic-argon':'#C98A92','hist-argon':'#9EB6D6','studio-argon':'#7F9BC4'};
const HAIR={'ludic-claude':'#4A3322','hist-claude':'#2F2118','studio-claude':'#8A5E36','ludic-argon':'#6B4A2E','hist-argon':'#3E2B1E','studio-argon':'#7A5232'};
const SEATS=R.agents.map(a=>{
  const row=modelById[a.model].row, p=POS[a.prompt][row], k=row==='front'?1:.82;
  return {id:a.id,agent:a,x:p.x,y:p.y,k,row,desk:row==='front'?300:256,look:0,v:versionsOf(a.id)[0]};
});
const FRAMES={ludic:{x:186},hist:{x:293},studio:{x:400}};
const REGIONS=[];
SEATS.forEach(s=>REGIONS.push({id:s.id,x:s.x-27*s.k,y:s.y-34*s.k,w:54*s.k,h:s.desk-(s.y-34*s.k),z:s.row==='front'?2:1,tag:()=>`${s.agent.label}: ${s.v?s.v.title:'no version yet'}`}));
COLS.forEach(c=>REGIONS.push({id:'p-'+c,x:FRAMES[c].x-32,y:88,w:64,h:56,z:1,tag:()=>`Starting prompt: ${promptById[c].title}`}));
REGIONS.push({id:'register',x:624,y:128,w:58,h:76,z:1,tag:()=>'The teacher: the register'});
REGIONS.push({id:'shelf',x:750,y:20,w:50,h:200,z:1,tag:()=>'The shelf: prompts'});
REGIONS.push({id:'line',x:610,y:204,w:150,h:240,z:1,tag:()=>'The machine: the shared line'});
REGIONS.push({id:'about',x:510,y:290,w:96,h:186,z:3,tag:()=>'The crank boy: who turns the crank'});
REGIONS.push({id:'repo',x:14,y:58,w:136,h:210,z:1,tag:()=>'The window: the repository'});
REGIONS.push({id:'notes',x:212,y:280,w:40,h:24,z:4,tag:()=>`Notes passed: ${NOTES.length}`});

/* ---------- drawing ---------- */
const cv=$('room'),ctx=cv.getContext('2d');
const view={s:1,ox:0,oy:0,dpr:1};
function blob(g,build,fill,lw=1.5,off=true){
  if(fill){g.save(); if(off) g.translate(1.3,.9); g.beginPath(); build(g); g.fillStyle=fill; g.fill(); g.restore();}
  if(lw){g.beginPath(); build(g); g.lineWidth=lw; g.strokeStyle=INK; g.lineJoin='round'; g.lineCap='round'; g.stroke();}
}
function hatch(g,build,gap=4,a=.3){
  g.save(); g.beginPath(); build(g); g.clip(); g.strokeStyle=`rgba(43,35,32,${a})`; g.lineWidth=.7; g.beginPath();
  for(let i=-700;i<1400;i+=gap){g.moveTo(i,-20); g.lineTo(i+540,520);} g.stroke(); g.restore();
}
const RECT=(x,y,w,h)=>g=>g.rect(x,y,w,h);
const CIRC=(x,y,r)=>g=>g.arc(x,y,r,0,TAU);
const POLY=pts=>g=>{g.moveTo(pts[0],pts[1]); for(let i=2;i<pts.length;i+=2) g.lineTo(pts[i],pts[i+1]); g.closePath();};

const stat=document.createElement('canvas'); stat.width=W*2; stat.height=H*2;
const grain=document.createElement('canvas'); grain.width=grain.height=160;
(()=>{const g=grain.getContext('2d'),d=g.createImageData(160,160); for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255; d.data[i]=d.data[i+1]=d.data[i+2]=v; d.data[i+3]=255} g.putImageData(d,0,0)})();
let grainPat=null;

function emblem(g,kind,cx,cy){
  g.strokeStyle=INK; g.fillStyle=INK; g.lineWidth=1.4;
  if(kind==='die'){ blob(g,RECT(cx-11,cy-11,22,22),'#F3ECD8',1.4); [[-6,-6],[6,-6],[0,0],[-6,6],[6,6]].forEach(([a,b])=>{g.beginPath(); g.arc(cx+a,cy+b,2,0,TAU); g.fill()}); }
  else if(kind==='timeline'){ g.beginPath(); g.moveTo(cx-18,cy); g.lineTo(cx+16,cy); [-14,-6,2,10].forEach(t=>{g.moveTo(cx+t,cy-4); g.lineTo(cx+t,cy+4)}); g.stroke(); g.beginPath(); g.moveTo(cx+20,cy); g.lineTo(cx+13,cy-4); g.lineTo(cx+13,cy+4); g.closePath(); g.fill(); g.beginPath(); g.arc(cx-6,cy-10,3,0,TAU); g.stroke(); }
  else { g.beginPath(); for(let i=0;i<16;i++){const a=i/16*TAU, r=i%2?9:12; g.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a))} g.closePath(); g.fillStyle='#C9A23E'; g.fill(); g.stroke(); g.beginPath(); g.arc(cx,cy,3.5,0,TAU); g.fillStyle='#F3ECD8'; g.fill(); g.stroke(); }
}
function buildStatic(){
  const g=stat.getContext('2d'); g.setTransform(2,0,0,2,0,0); g.clearRect(0,0,W,H);
  blob(g,RECT(0,0,W,272),'#E8D59A',0,false); hatch(g,RECT(0,0,W,26),3,.18);
  blob(g,RECT(0,0,W,10),'#8C6A44',1.2,false);
  blob(g,RECT(18,62,128,202),'#9C7A50'); blob(g,RECT(28,72,108,182),'#DDE7E2');
  g.strokeStyle=INK; g.lineWidth=2.4; g.beginPath(); g.moveTo(82,72); g.lineTo(82,254); g.moveTo(28,132); g.lineTo(136,132); g.moveTo(28,194); g.lineTo(136,194); g.stroke();
  hatch(g,RECT(28,72,30,182),5,.12);
  const cur=g=>{g.moveTo(10,56);g.quadraticCurveTo(40,150,22,272);g.lineTo(8,272);g.closePath()};
  blob(g,cur,'#D5CDB8'); hatch(g,cur,4,.25);
  blob(g,RECT(0,272,W,62),'#C89585',0,false);
  g.strokeStyle='rgba(43,35,32,.45)'; g.lineWidth=1; g.beginPath(); for(let x=20;x<W;x+=38){g.moveTo(x,276);g.lineTo(x,334)} g.stroke();
  blob(g,RECT(0,266,W,8),'#A86F62',1.2,false);
  blob(g,RECT(0,334,W,166),'#CFA873',0,false);
  g.strokeStyle='rgba(110,78,40,.7)'; g.lineWidth=1; g.beginPath(); for(let i=-8;i<=22;i++){const bx=i*55; g.moveTo(400+(bx-400)*.42,334); g.lineTo(bx,500)} g.stroke();
  g.strokeStyle='rgba(110,78,40,.35)'; g.beginPath(); [372,420,476].forEach(y=>{g.moveTo(0,y);g.lineTo(W,y)}); g.stroke();
  hatch(g,RECT(0,334,W,30),4,.15); blob(g,RECT(0,331,W,4),'#7B5A3A',1,false);
  // the three starting prompts, framed above their columns
  COLS.forEach(c=>{
    const x=FRAMES[c].x-28,y=94,w=56,h=46;
    g.strokeStyle=INK; g.lineWidth=1; g.beginPath(); g.moveTo(x+6,y); g.lineTo(x+w/2,y-12); g.lineTo(x+w-6,y); g.stroke();
    blob(g,RECT(x-4,y-4,w+8,h+8),'#8C6A44',1.2); blob(g,RECT(x,y,w,h),'#F0E4C0',1);
    blob(g,RECT(x+4,y+h-8,w-8,4),COLOR[c],.8);
    emblem(g,promptById[c].emblem,x+w/2,y+h/2-4);
  });
  g.fillStyle=INK; g.font='24px "IM Fell English SC", Georgia, serif'; g.textAlign='center'; g.fillText("EN L'AN 2000",612,40);
  // shelf
  blob(g,RECT(752,22,48,196),'#7A5536');
  const spines=['#B44A3C','#5E7F4E','#C9A23E','#4F6A88','#8C3F35','#B88B3A','#3F5A44','#A86F62'];
  [[34,70],[80,118],[126,164],[172,210]].forEach(([y0,y1],r)=>{let x=756; for(let i=0;i<4;i++){const w=9+((i+r)%3)*2; blob(g,RECT(x,y0+((i+r)%2)*4,w,y1-y0-((i+r)%2)*4),spines[(i*3+r)%spines.length],1); x+=w+1} blob(g,RECT(752,y1,48,4),'#5C3F28',1,false)});
  // ceiling line and bundle
  g.strokeStyle=INK; g.lineWidth=3; g.beginPath(); g.moveTo(140,54); g.lineTo(744,54); g.stroke();
  g.lineWidth=1.3; g.beginPath(); for(let i=0;i<6;i++){g.moveTo(733+i*2.4,54); g.lineTo(733+i*2.4,206)} g.stroke();
  SEATS.forEach(s=>blob(g,CIRC(s.x,54,4.5),'#C9A23E',1.2)); blob(g,CIRC(738,54,6),'#C9A23E',1.2);
}

let sel='home', hover=null, angle=0, frags=[], fragAcc=0, last=performance.now();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

function seatTop(s){return s.y+0-17*s.k}
function drawStudent(s){
  const k=s.k,x=s.x,hy=s.y,top=hy-17*k;
  ctx.strokeStyle=INK; ctx.lineWidth=1.1; ctx.beginPath(); ctx.moveTo(x,58); const n=Math.floor((top-58)/6); for(let i=1;i<=n;i++) ctx.lineTo(x+(i%2?4:-4),58+i*(top-58)/n); ctx.lineTo(x,top); ctx.stroke();
  // version tag tied on the wire
  const sh=hy+15*k,bot=s.desk+4;

  </dl><p>${esc(v.line)}</p>`;
  if(more.length) body+=`<p class="said">Earlier from this seat: ${more.map(x=>`<a href="${esc(x.play)}">${esc(x.tag)}: ${esc(x.title)}</a>`).join(', ')}</p>`;
  if(v.id==='v1') body+=`<details${openMaking?' open':''}><summary>Theory of play</summary><div class="tw"><table><tr><th>Rule</th><th>What it does in play</th></tr>${V1_RULES.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table></div><p style="margin-top:6px">The game never says which way the river flows. <a href="docs/theory.md">Full theory</a>.</p></details>
    <details${openMaking?' open':''}><summary>How it was made</summary><ol class="st">${V1_STEPS.map(t=>`<li>${esc(t)}</li>`).join('')}</ol><p>The prompts are on the <button class="linkish" type="button" data-go="shelf">shelf</button>.</p></details>`;
  const making=v.making.startsWith('#')?`<button class="btn" type="button" data-go="v1-making">How it was made</button>`:`<a class="btn" href="${esc(v.making)}">How it was made</a>`;
  setCard(`${rowWord(s)} · ${p.title} column · version ${v.tag}`,`${esc(v.title)} <span class="stamp">${v.status==='built'?'Built':'Not built'}</span>`,body,
    `<a class="btn primary" href="${esc(v.play)}">Play</a>${making}`);
}
function renderPrompt(c){
  const p=promptById[c];
  const cardFor=row=>{const s=SEATS.find(q=>q.agent.prompt===c&&q.row===row), m=modelById[s.agent.model], v=s.v;
    return `<div class="mini"><span class="r">${row==='back'?'Back':'Front'} · ${esc(m.name)}</span>${v?`<b><span class="ptag">${esc(v.tag)}</span> ${esc(v.title)}</b><p><i>You play:</i> ${esc(v.youPlay)}</p><div class="acts"><a class="btn small" href="${esc(v.play)}">Play</a><button class="btn small" type="button" data-go="${s.id}">Open seat</button></div>`:'<p>No version yet.</p>'}</div>`};
  setCard(`Starting prompt · the ${p.title} column`,esc(p.full),
    `<p>${esc(p.line)}</p><div class="two">${cardFor('back')}${cardFor('front')}</div>`,
    `${copyBtn(c,'Copy the prompt','btn primary')}<a class="btn" href="${esc(p.file)}">Open file</a>`);
}
function renderRegister(){
  const order=['back','front'].flatMap(row=>COLS.map(c=>SEATS.find(s=>s.agent.prompt===c&&s.row===row)));
  const rows=order.filter(s=>s.v).map(s=>`<tr class="go" data-go="${s.id}"><td><span class="ptag">${esc(s.v.tag)}</span></td><td>${esc(s.v.title)}</td><td>${esc(promptById[s.agent.prompt].title)}</td><td>${s.row==='back'?'Argon':'Opus'}</td><td>${esc(s.v.youPlay)}</td><td><a href="${esc(s.v.play)}">Play</a></td></tr>`).join('');
  const props=R.proposals.map(p=>`<tr><td><span class="ptag" style="background:var(--paper)">${esc(p.id.slice(1))}</span></td><td>${esc(p.title)}</td><td colspan="3" class="pl">${esc(p.line)}</td><td>${copyBtn(p.id,'Copy')}</td></tr>`).join('');
  setCard('The teacher keeps the register','Register',
    `<div class="tw"><table class="reg"><tr><th>No.</th><th>Version</th><th>Prompt</th><th>Model</th><th>You play</th><th></th></tr>${rows}
     <tr><th colspan="6">Proposed by ${esc(seatLabel('ludic-claude'))}, not built</th></tr>${props}</table></div>
     <p class="said" style="margin-top:6px">Select a row to open that seat.</p>`,'');
  $('body').querySelectorAll('tr.go').forEach(tr=>tr.addEventListener('click',e=>{if(e.target.closest('a,button'))return; go(tr.dataset.go)}));
}
function renderShelf(){
  const groups=[...new Set(R.library.map(l=>l.group))];
  const spine={ludic:COLOR.ludic,hist:COLOR.hist,studio:COLOR.studio,join:'#C9733A'};
  setCard('The shelf holds every prompt','Prompts',
    groups.map(g=>`<div class="grp">${esc(g)}</div>`+R.library.filter(l=>l.group===g).map(l=>`<div class="book"><span class="sp" style="background:${spine[l.key]||'#8C6A44'}"></span><span class="bt"><b>${esc(l.title)}</b><span>${esc(l.note)}</span></span><span class="ba">${copyBtn(l.key)}<a href="${esc(l.file)}">Open</a></span></div>`).join('')).join(''),'');
}
function renderNotes(){
  const list=(noteFilter?NOTE_FOR(noteFilter):NOTES).slice().reverse();
  const head=noteFilter?`<p class="said">Notes to or from ${esc(seatLabel(noteFilter))}. <button class="linkish" type="button" data-filter="">Show all ${NOTES.length}</button></p>`:'';
  setCard('A folded note on the desk','Notes between the agents',
    head+list.map(n=>`<div class="note"><span class="hd">${esc(n.id)} · ${esc(n.date)} · ${esc(seatLabel(n.from))} to ${(n.to||[]).map(t=>t==='all'?'everyone':esc(seatLabel(t))).join(', ')}${n.re?` · answers ${esc(n.re)}`:''}</span><b>${esc(n.subject)}</b><p>${esc(n.body)}</p>${(n.links||[]).length?`<span class="ln">${n.links.map(l=>`<a href="${esc(l)}">${esc(l)}</a>`).join(' · ')}</span>`:''}</div>`).join('')
    +`<p class="said">Agents pass notes by adding them to registry/notes.js. The <button class="linkish" type="button" data-go="line">shared line</button> explains how.</p>`,'');
}
function renderLine(){
  setCard('The machine feeds every wire','The shared line',
    `<p>Six agents work in six separate conversations. None of them can see the others' context, so they share one set of files in the repository. This page is drawn from those files.</p>
     <dl class="facts">
      <dt>Protocol</dt><dd><a href="AGENTS.md">AGENTS.md</a>: seats, what to read first, how to add a version, how to pass a note, how to commit. CLAUDE.md and GEMINI.md point to it.</dd>
      <dt>Registry</dt><dd><a href="registry/registry.js">registry/registry.js</a>: every prompt, seat and version. Agents edit their own entries; nobody edits this page.</dd>
      <dt>Notes</dt><dd><a href="registry/notes.js">registry/notes.js</a>: append-only notes between seats, with replies linked by id.</dd>
      <dt>Design</dt><dd><a href="DESIGN.md">DESIGN.md</a> and <a href="room/room.css">room/room.css</a>: the print palette, the type, and the link back to this classroom.</dd>
      <dt>Check</dt><dd><code>node registry/check.js</code> must print OK before a commit.</dd>
     </dl>
     <p>To put an agent on the line, paste the join prompt into its conversation with its seat id filled in.</p>`,
    `${copyBtn('join','Copy the join prompt','btn primary')}<a class="btn" href="AGENTS.md">Read the protocol</a>`);
}
function renderAbout(){
  const pc=R.postcard;
  setCard('At the crank','Who turns the crank',
    `<img class="thumb" src="${esc(pc.image)}" alt="The postcard At School: six pupils in wired headsets, a teacher feeding books into a machine, a boy turning its crank." width="800" height="487">
     <dl class="facts">${R.people.map(p=>`<dt>${esc(p.name)}</dt><dd>${esc(p.role)}</dd>`).join('')}</dl>
     <p><i>${esc(pc.title)}</i>, from <i>${esc(pc.series)}</i>, ${esc(pc.attribution)}. The machine in the picture is not automatic: a boy turns its crank and is the only pupil without a headset. Every version starts from that room.</p>
     <dl class="facts"><dt>Documented</dt><dd>The postcard and its layout.</dd><dt>Interpretation</dt><dd>That the machine turns books into a signal that carries what the book says.</dd><dt>Invented</dt><dd>Every book, page, name, map, lesson and verdict inside the games. Each game has its own ledger.</dd></dl>`,
    `<a class="btn primary" href="${esc(pc.archive)}">Archive of Past Futures</a>`);
}
function renderRepo(){
  setCard('Through the window','The repository',
    `<p>Everything here is plain HTML with no build step.</p>
     <dl class="facts">
      <dt>play/</dt><dd>The games: ${R.versions.filter(v=>v.play.startsWith('play/')).map(v=>`<a href="${esc(v.play)}">${esc(v.play.slice(5))}</a>`).join(', ')}</dd>
      <dt>making/</dt><dd>How each was made: ${R.versions.filter(v=>v.making.startsWith('making/')).map(v=>`<a href="${esc(v.making)}">${esc(v.making.slice(7))}</a>`).join(', ')}</dd>
      <dt>scion/</dt><dd>Case 01: <a href="scion/case-01.html">case-01.html</a>, <a href="scion/process.html">process.html</a>, the engine and its playtest.</dd>
      <dt>docs/</dt><dd>Starting prompts, other instructions, <a href="docs/theory.md">theory.md</a>, <a href="docs/prompts.md">prompts.md</a>.</dd>
      <dt>registry/</dt><dd>The shared line: registry, notes, library, check.</dd>
     </dl>`,
    `<a class="btn primary" href="https://github.com/hartswf0/crank-boy">Open on GitHub</a>`);
}

$('home').addEventListener('click',()=>go('home'));
window.addEventListener('hashchange',render);
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&location.hash&&location.hash!=='#home') go('home')});
buildPlan(); buildStatic(); if(document.fonts&&document.fonts.ready) document.fonts.ready.then(buildStatic);
new ResizeObserver(resize).observe($('stage')); resize(); render(); requestAnimationFrame(tick);
})();
</script>
